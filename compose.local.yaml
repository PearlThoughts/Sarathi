name: sarathi-local

services:
  sarathi-postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: sarathi_local
      POSTGRES_PASSWORD: sarathi_local_only
      POSTGRES_USER: sarathi_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarathi_local -d sarathi_local"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - sarathi-postgres-data:/var/lib/postgresql

  product-studio-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: product_studio_local
      POSTGRES_PASSWORD: product_studio_local_only
      POSTGRES_USER: product_studio_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_studio_local -d product_studio_local"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - product-studio-postgres-data:/var/lib/postgresql

volumes:
  sarathi-postgres-data:
  product-studio-postgres-data:
